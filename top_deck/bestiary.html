<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bestiary - Realm & Rune</title>

    <!-- Common site styling -->
    <link rel="stylesheet" href="realm-and-rune.css">

    <!-- Bestiary-specific styling -->
    <style>
        .bestiary-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .bestiary-intro {
            margin-bottom: 2rem;
        }

        #bestiary {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-start;
        }
    </style>
</head>

<body>

    <!-- Modular navigation -->
    <iframe
        src="header.html"
        title="Navigation"
        style="width:100%; height:80px; border:0;">
    </iframe>

    <main class="bestiary-container">

        <h1>Bestiary</h1>

        <section class="bestiary-intro">
            <p>
                The creatures below are designed for the Realm & Rune card-based
                combat system. Each enemy has a level represented by a playing
                card, a suit affinity, a hand size, core attributes, and special
                abilities.
            </p>
        </section>

        <section id="bestiary">
            <p>Loading bestiary...</p>
        </section>

    </main>

    <iframe
        src="footer.html"
        title="Footer"
        style="width:100%; height:120px; border:0;">
    </iframe>

    <script src="bestiary.js"></script>

</body>
</html>
